<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Risk-Based Lot Size Calculator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.result{
    margin-top:25px;
    background:#f0f7ff;
    border:1px solid #cfe3ff;
    border-radius:8px;
    padding:20px;
}

.big{
    font-size:30px;
    font-weight:bold;
    color:#0066cc;
}

.small{
    color:#666;
    margin-top:8px;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    background:#0066cc;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}
</style>
</head>
<body>

<div class="container">

<h2>Lot Size Calculator</h2>

<label>Sample Lot Size</label>
<input id="sampleLot" type="number" step="0.01" value="0.01">

<label>Risk at Sample Lot (USD)</label>
<input id="sampleRisk" type="number" step="0.01">

<label>Desired Risk (USD)</label>
<input id="desiredRisk" type="number" step="0.01">

<label>Lot Step (Broker Minimum Increment)</label>
<input id="lotStep" type="number" step="0.01" value="0.01">

<button onclick="calculate()">Calculate</button>

<div class="result">
    <div>Recommended Lot Size</div>
    <div id="lotResult" class="big">0.00</div>
    <div id="formula" class="small"></div>
</div>

</div>

<script>

const fields = [
    "sampleLot",
    "sampleRisk",
    "desiredRisk",
    "lotStep"
];

function saveData(){
    fields.forEach(id=>{
        localStorage.setItem(id,document.getElementById(id).value);
    });
}

function loadData(){
    fields.forEach(id=>{
        const value = localStorage.getItem(id);

        if(value !== null){
            document.getElementById(id).value = value;
        }
    });

    calculate();
}

function roundToStep(value, step){
    return Math.round(value / step) * step;
}

function calculate(){

    saveData();

    const sampleLot =
        parseFloat(document.getElementById("sampleLot").value);

    const sampleRisk =
        parseFloat(document.getElementById("sampleRisk").value);

    const desiredRisk =
        parseFloat(document.getElementById("desiredRisk").value);

    const lotStep =
        parseFloat(document.getElementById("lotStep").value);

    if(
        isNaN(sampleLot) ||
        isNaN(sampleRisk) ||
        isNaN(desiredRisk) ||
        sampleRisk <= 0
    ){
        return;
    }

    let lotSize =
        (desiredRisk / sampleRisk) * sampleLot;

    lotSize = roundToStep(lotSize, lotStep);

    document.getElementById("lotResult").innerHTML =
        lotSize.toFixed(2);

    document.getElementById("formula").innerHTML =
        `${desiredRisk} ÷ ${sampleRisk} × ${sampleLot} = ${lotSize.toFixed(2)} lots`;
}

fields.forEach(id=>{
    document.getElementById(id)?.addEventListener(
        "input",
        calculate
    );
});

window.onload = loadData;

</script>

</body>
</html>
